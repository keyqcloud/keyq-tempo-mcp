# Publish to npm when package.json's version changes.
#
# Exists because the package silently was not published at all, and nothing said so. A box
# running `npx @keyqinc/tempo-mcp enroll-fleet <code>` got a 404 from the registry — the fleet's
# whole one-command onboarding rested on a package that had never shipped.
#
# Version-change triggered rather than tag-triggered, deliberately: bumping the version IS
# the release, so there is no second ceremony to forget. A tag you have to remember to push
# is the same failure in a different costume.
#
# Authenticates by Trusted Publishing, so there is no NPM_TOKEN to store or rotate, and
# STAGES rather than publishes - a person approves each release. See the last step.
name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - '.github/workflows/publish.yml'
  # Manual runs exist for the first publish, and for recovering when a run failed after a
  # version bump had already landed on main.
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

# Trusted Publishing (OIDC) rather than a stored NPM_TOKEN. npm itself recommends this for
# CI, and it is the better answer here for a reason this project keeps running into: a
# stored token is one more credential with an expiry date that nothing watches. This has
# none - GitHub proves the workflow's identity per run, and npm trusts that specific
# repo+workflow rather than a secret someone has to rotate.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NO registry-url. Setting it makes setup-node write an .npmrc containing
      # _authToken=${NODE_AUTH_TOKEN}, and with no token that authenticates as nobody — npm
      # sees an explicit credential config and never falls back to OIDC, so Trusted
      # Publishing is silently bypassed. It fails as a 404 on PUT, which reads like the
      # package is missing rather than like an auth problem.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Compare against what is actually on the registry rather than against the previous
      # commit. A re-run, a revert, or a failed earlier publish all leave those two
      # disagreeing, and the registry is the one that decides whether `npx` works.
      #
      # A STAGED version is deliberately invisible here - it is not on the registry yet.
      # So this says "publish" for something already awaiting approval, and the stage step
      # then fails on the duplicate. Correct, if briefly confusing: the work to do is in
      # the approval queue, not here.
      - name: Is this version already published?
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view "$NAME" version 2>/dev/null || echo "none")
          echo "local=$LOCAL remote=$REMOTE"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$LOCAL is already on npm — nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      # Build explicitly rather than leaning on `prepare`. A publish that silently shipped a
      # stale dist/ would be worse than one that failed: the package would exist, install
      # fine, and run yesterday's code.
      - if: steps.check.outputs.publish == 'true'
        run: npm run build

      # Trusted Publishing needs a recent npm; the one bundled with Node is often older
      # than the OIDC support, and the failure reads as a plain auth error rather than as
      # "your npm is too old".
      - if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest

      # STAGE, do not publish. No NODE_AUTH_TOKEN either way: npm exchanges the workflow's
      # OIDC identity for a short-lived credential itself, so nothing is stored and nothing
      # expires on a calendar.
      #
      # The trusted publisher is deliberately NOT granted "Allow npm publish". This uploads
      # the version to a queue where it is live to nobody until a person approves it:
      #
      #   npm stage list                 # on a machine where you are logged in
      #   npm stage view <stage-id>      # inspect what CI actually built
      #   npm stage approve <stage-id>   # promote it (passkey / 2FA)
      #   npm stage reject <stage-id>    # discard it
      #
      # Those subcommands cannot use OIDC by design - approval requires proof of presence.
      # That is the point, and the extra click is worth it for THIS package specifically:
      # fleet boxes install it with `npx -y`, so a bad version does not sit in a registry
      # waiting to be depended on. It runs on our own machines - the ones holding Tempo
      # device tokens and minting GitHub App credentials - at the next scheduled tick. PR
      # review before merge is the first gate; this is the second, and it is the one an
      # attacker holding repo write cannot walk through.
      #
      # A pending approval breaks nothing: the previously published version stays live.
      #
      # Re-running after a version is staged but not yet approved fails on the duplicate.
      # That is deliberate. It should be loud rather than skipped, because the fix is to go
      # approve or reject whatever is already waiting.
      - if: steps.check.outputs.publish == 'true'
        run: npm stage publish --access public
